<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test fill</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .cal-header{
            text-align: center;
        }

        .card{
            width:300px;
            height:auto;
            margin: auto;
            text-align: center;
            background-color: blueviolet;
            font-size: 0;

        }

        #result{
            width:100%;
            height:80px;
            text-align: right;
            padding: 5px;
            letter-spacing: 2px;
            font-size: 2rem;
            font-weight: bold;


        }

        .btn{
            width: 75px;
            height: 60px;
            font-size:2rem;
            font-weight: bold;
            background-color: black;
            color:white;

        }

        .btn:hover{
            background-color: gray;
        }

    </style>
</head>
<body>
    <h1 class="cal-header">Calculator</h1>
    <div class="card">
        <div class="cal-head">
            <input type="texg" id="result" maxlength="20">
        </div>
        <div class="cal-body">
            <div>
                <input type="button" class="btn" value="AC">
                <input type="button" class="btn" value="←">
                <input type="button" class="btn" value="+/-">
                <input type="button" class="btn btn-style" value="÷">
            </div>
            <div>
                <input type="button" class="btn" value="7">
                <input type="button" class="btn" value="8">
                <input type="button" class="btn" value="9">
                <input type="button" class="btn btn-style" value="x">
            </div>
            <div>
                <input type="button" class="btn" value="4">
                <input type="button" class="btn" value="5">
                <input type="button" class="btn" value="6">
                <input type="button" class="btn btn-style" value="-">
            </div>
            <div>
                <input type="button" class="btn" value="1">
                <input type="button" class="btn" value="2">
                <input type="button" class="btn" value="3">
                <input type="button" class="btn btn-style" value="+">
            </div>
            <div>
                <input type="button" class="btn" value="%">
                <input type="button" class="btn" value="0">
                <input type="button" class="btn" value="•">
                <input type="button" class="btn" style="background-color: orange;" value="=">
            </div>
        </div>
    
    </div><br>

</body>
</html>
